services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cook}
      POSTGRES_DB: ${POSTGRES_DB:-cookwithwhatyouhave}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/CookWithWhatYouHave.Api/Dockerfile
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-cookwithwhatyouhave};Username=${POSTGRES_USER:-cook};Password=${POSTGRES_PASSWORD:-cook}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-gemini-3.6-flash}
      Gemini__EmbeddingModel: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      Gemini__EmbeddingDimensions: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      OpenFoodFacts__BaseUrl: https://es.openfoodfacts.org
      OpenFoodFacts__UserAgent: CookWithWhatYouHave/1.0 (dev)
      Superfudis__BaseUrl: https://supercomparador-i9tw.onrender.com
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: src/CookWithWhatYouHave.Web/Dockerfile
    environment:
      Api__BaseUrl: http://api:8080
    ports:
      - "8081:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
